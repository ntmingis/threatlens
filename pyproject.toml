[project]
name = "threatlens"
version = "0.1.0"
description = "File and URL risk-assessment scanner: static analysis, ClamAV, evidence-based reports"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pymupdf>=1.24",
  "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend", "tests"]
